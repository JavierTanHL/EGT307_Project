apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: models-pvc
  namespace: defect-detection
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 3Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inference-deployment
  namespace: defect-detection
spec:
  replicas: 1
  selector:
    matchLabels: {app: inference}
  template:
    metadata:
      labels: {app: inference}
    spec:
      initContainers:
        - name: seed-models
          image: defect-inference:1.0
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - 'if [ -z "$(ls -A /shared-models 2>/dev/null)" ]; then cp -v /app/models-default/*.keras /shared-models/ 2>/dev/null || true; fi'
          volumeMounts:
            - name: models
              mountPath: /shared-models
      containers:
        - name: inference
          image: defect-inference:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8001
          env:
            - name: MODELS_DIR
              valueFrom:
                configMapKeyRef: {name: defect-config, key: MODELS_DIR}
            - name: DEFAULT_ITEM
              valueFrom:
                configMapKeyRef: {name: defect-config, key: DEFAULT_ITEM}
            - name: IMAGE_SIZE
              valueFrom:
                configMapKeyRef: {name: defect-config, key: IMAGE_SIZE}
            - name: GOOD_THRESHOLD
              valueFrom:
                configMapKeyRef: {name: defect-config, key: GOOD_THRESHOLD}
          volumeMounts:
            - name: models
              mountPath: /app/models
          readinessProbe:
            httpGet: {path: /ready, port: 8001}
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            httpGet: {path: /health, port: 8001}
            initialDelaySeconds: 45
          resources:
            requests: {cpu: 300m, memory: 768Mi}
            limits: {cpu: "1", memory: 2Gi}
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: models-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: inference-service
  namespace: defect-detection
spec:
  selector: {app: inference}
  ports:
    - port: 8001
      targetPort: 8001
